[project]
name = "twbt"
version = "0.1.0"
description = "A small Taiwan-futures backtester built around point-in-time and multiple-testing discipline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # the cache and the fixture are parquet; pandas needs an engine for both
    "pyarrow>=14.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient, which test_web.py uses
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
twbt = "twbt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
