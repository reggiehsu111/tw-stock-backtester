<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}twbt tearsheet{% endblock %}</title>
<style>
/* Tokens. The bare :root block is the complete light palette; the media query and
   the [data-theme] stamp redefine the same names, so every component below styles
   through tokens and never inside a theme block. */
:root {
  --paper:      #ffffff;
  --surface:    #f7f8fa;
  --ink:        #15181d;
  --ink-soft:   #596273;   /* grey biased toward the accent, not neutral */
  --rule:       #dfe3ea;
  --rule-soft:  #eceff4;
  --accent:     #2f5d8a;
  --alert:      #9c3d2e;
  --ok:         #3f6b4a;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:     #14171c;
    --surface:   #1b1f26;
    --ink:       #e6e9ee;
    --ink-soft:  #97a1b2;
    --rule:      #2b313b;
    --rule-soft: #222730;
    --accent:    #7aa9d6;
    --alert:     #e08a78;
    --ok:        #8fc3a0;
  }
}
:root[data-theme="dark"] {
  --paper:     #14171c;
  --surface:   #1b1f26;
  --ink:       #e6e9ee;
  --ink-soft:  #97a1b2;
  --rule:      #2b313b;
  --rule-soft: #222730;
  --accent:    #7aa9d6;
  --alert:     #e08a78;
  --ok:        #8fc3a0;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 72px; }

header.top {
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
  padding: 18px 0 16px;
  margin-bottom: 28px;
}
header.top .wrap { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-bottom: 0; }
header.top h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
header.top h1 a { color: var(--ink); text-decoration: none; }
header.top .sub { color: var(--ink-soft); font-size: 13px; }
.badge {
  font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
  text-transform: uppercase; padding: 2px 7px; border-radius: 3px;
  border: 1px solid var(--rule); color: var(--ink-soft);
}

h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--ink-soft); font-weight: 600;
  margin: 38px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--rule-soft);
}
p { margin: 0 0 12px; }
.note { color: var(--ink-soft); font-size: 13.5px; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface);
       padding: 1px 5px; border-radius: 3px; }
a { color: var(--accent); }

/* numbers line up in columns everywhere */
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule-soft); }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 600; color: var(--ink-soft); font-size: 12px;
     text-transform: uppercase; letter-spacing: .05em; }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }

.verdict { list-style: none; padding: 0; margin: 0; display: flex;
           flex-direction: column; gap: 8px; }
.verdict li {
  padding: 10px 13px; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--surface); font-size: 14px;
  border-left: 3px solid var(--ok);
}
.verdict li.fail { border-left-color: var(--alert); }
.verdict li.fail strong { color: var(--alert); }

.figure { margin: 0 0 8px; }
.figure svg { width: 100%; height: auto; display: block; }
figcaption { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }

/* chart primitives, styled once for every SVG the server renders */
svg .grid   { stroke: var(--rule-soft); stroke-width: 1; }
svg .axis   { stroke: var(--rule); stroke-width: 1; }
svg .zero   { stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
svg .marker { stroke: var(--alert); stroke-width: 1; stroke-dasharray: 3 3; opacity: .8; }
svg .line   { fill: none; stroke-width: 1.9; stroke-linejoin: round; stroke-linecap: round; }
svg .line.thin { stroke-width: 1.3; opacity: .85; }
svg .line.avg  { stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 5 4; fill: none; }
svg .tick, svg .legend, svg .axlab, svg .marklab, svg .empty {
  font-family: var(--mono); fill: var(--ink-soft); }
svg .tick   { font-size: 10.5px; }
svg .ytick  { text-anchor: end; }
svg .xtick  { text-anchor: middle; }
svg .axlab  { font-size: 11px; text-anchor: middle; }
svg .marklab{ font-size: 10px; fill: var(--alert); }
svg .legend { font-size: 11.5px; fill: var(--ink); }
svg .legend .num { fill: var(--ink-soft); }
svg .avglab { fill: var(--ink); }
svg .swatch { width: 9px; height: 9px; rx: 1; }
svg .empty  { font-size: 13px; }

.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card {
  display: block; text-decoration: none; color: inherit;
  border: 1px solid var(--rule); border-radius: 5px; padding: 14px 15px;
  background: var(--surface);
}
.card:hover { border-color: var(--accent); }
.card h3 { margin: 0 0 9px; font-size: 15px; font-family: var(--mono); }
.card dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0; font-size: 13px; }
.card dt { color: var(--ink-soft); }
.card dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.card .flag { margin-top: 9px; font-size: 12px; color: var(--alert); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1><a href="/">tw-stock-backtester</a></h1>
    <span class="sub">{% block subtitle %}{% endblock %}</span>
    {% if fixture %}<span class="badge">fixture data</span>{% endif %}
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
</body>
</html>
